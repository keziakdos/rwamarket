<!doctype html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RwaMarket - Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#070d18",
            panel: "#0d1728",
            edge: "#1e293b",
            mint: "#2dd4bf",
            azure: "#3b82f6"
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    html { zoom: 1.25; }
    @supports not (zoom: 1) { html { zoom: normal; font-size: 20px; } }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orb { position: fixed; border-radius: 9999px; filter: blur(100px); pointer-events: none; opacity: .45; }
    .orb-a { width: 520px; height: 520px; background: #0f766e; top: -180px; left: -140px; }
    .orb-b { width: 460px; height: 460px; background: #1d4ed8; bottom: -190px; right: -120px; }
    .glass { background: rgba(13, 23, 40, .78); border: 1px solid rgba(148, 163, 184, .18); backdrop-filter: blur(24px); }
    .grid-lines {
      background-image: linear-gradient(rgba(148, 163, 184, .04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(148, 163, 184, .04) 1px, transparent 1px);
      background-size: 42px 42px;
    }
  </style>
</head>
<body class="h-full bg-ink text-slate-200 antialiased overflow-hidden">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="fixed inset-0 grid-lines pointer-events-none"></div>

  <main class="relative min-h-full flex items-center justify-center px-4 py-10">
    <section class="glass w-full max-w-md rounded-[28px] p-8 sm:p-10 shadow-2xl shadow-black/50">
      <div class="flex items-center gap-3 mb-8">
        <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-mint to-azure grid place-items-center shadow-lg shadow-teal-900/40">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 17l5-5 4 4 8-9"/><path d="M16 7h4v4"/>
          </svg>
        </div>
        <div>
          <div class="text-xl font-semibold tracking-tight text-white">RwaMarket</div>
          <div class="text-[10px] uppercase tracking-[.22em] text-teal-300">Multi-Agent Trading</div>
        </div>
      </div>

      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">Accès sécurisé</h1>
      <p class="mt-2 mb-7 text-sm leading-6 text-slate-400">
        Analyse quantitative, débat multi-agents et portefeuille Paper Trading.
      </p>

      {% if error %}
      <div class="mb-5 rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" autocomplete="off" class="space-y-5">
        <div>
          <label for="password" class="mb-2 block text-xs font-medium uppercase tracking-[.12em] text-slate-400">Mot de passe</label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
              </svg>
            </span>
            <input id="password" name="password" type="password" required autofocus placeholder="Entrez votre mot de passe"
              class="w-full rounded-xl border border-edge bg-slate-950/70 py-3.5 pl-11 pr-4 text-sm text-slate-100 outline-none transition focus:border-mint focus:ring-4 focus:ring-teal-500/10">
          </div>
        </div>
        <button type="submit"
          class="w-full rounded-xl bg-gradient-to-r from-teal-500 to-blue-600 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-teal-900/30 transition hover:brightness-110 active:scale-[.995]">
          Se connecter
        </button>
      </form>

      <p class="mt-7 text-center text-[11px] leading-5 text-slate-500">
        Application privée. Analyse éducative, pas un conseil financier.
      </p>
    </section>
  </main>
</body>
</html>
